spring.application.name=brewery-pms

# Runtime overrides supported: brewery-pms.env DB_URL/DB_USERNAME/DB_PASSWORD
# or --spring.datasource.url/username/password.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/brewery_pms?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Password@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=${app.timezone}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# Run lightweight compatibility migrations such as widening permission fields.
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

spring.jackson.time-zone=${app.timezone}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

server.port=${SERVER_PORT:8080}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

logging.file.name=${LOG_FILE:logs/brewery-pms.log}
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.org.springframework.web=${LOG_LEVEL_WEB:INFO}
logging.level.org.hibernate.SQL=${LOG_LEVEL_SQL:WARN}

app.timezone=${APP_TIMEZONE:UTC}

app.upload.footer-buttons.dir=${UPLOAD_DIR:./uploads/footer-buttons}
app.upload.attachments.dir=${ATTACHMENT_UPLOAD_DIR:./uploads/attachments}
app.email-config.secret=${APP_EMAIL_CONFIG_SECRET:dev-email-config-secret-change-me}
app.email-config.test-rate-limit-ms=${APP_EMAIL_CONFIG_TEST_RATE_LIMIT_MS:5000}
