<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="navigation" class="sidebar-nav" aria-label="Cloud navigation">
    <a th:each="page : ${cloudConfigPages}" th:href="${page.href}" class="nav-item" th:attr="data-tooltip=${page.title}">
        <i class="fas fa-sliders" aria-hidden="true"></i><span th:text="${page.title}"></span>
    </a>
    <div class="nav-parent" th:if="${!#lists.isEmpty(cloudMasterPages)}">
        <a href="#" class="nav-item nav-parent-toggle" data-tooltip="Master Data"><i class="fas fa-layer-group" aria-hidden="true"></i><span>Master Data</span><i class="fas fa-chevron-down nav-chevron" aria-hidden="true"></i></a>
        <div class="nav-children">
            <a th:each="page : ${cloudMasterPages}" th:href="${page.href}" class="nav-item nav-child" th:attr="data-tooltip=${page.title}">
                <i class="fas fa-database" aria-hidden="true"></i><span th:text="${page.title}"></span>
            </a>
        </div>
    </div>
</nav>
</body>
</html>
