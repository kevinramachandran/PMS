<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemba Walk Schedule - Carlsberg Brewery</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/dashboard.css?v=nav-size-20260814">
    <link rel="stylesheet" href="/css/gemba-schedule.css">
    <link rel="stylesheet" href="/css/pms-attachment.css?v=20260830">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    <link rel="stylesheet" href="/css/ui-shell.css?v=sticky-table-header-20260913">
</head>
<body class="modern-shell dashboard-bg" th:attr="data-can-edit-current-page=${canEditCurrentPage}">
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="app-container">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">
                <img class="logo header-logo" src="/images/image.png" alt="Carlsberg Logo">
            </div>
        </div>
        <nav th:replace="~{fragments/local-navigation :: navigation}"></nav>
        <div class="sidebar-footer">
            <img src="/images/solvex-logo.png" alt="SolveX" class="sidebar-solvex-logo">
        </div>
    </aside>

    <main class="main-content">
        <header class="top-header">
            <div class="header-left">
                <div class="hamburger" id="hamburger"><span></span><span></span><span></span></div>
                <h1>Gemba Walk Schedule</h1>
            </div>
            <div class="header-right">
                <div class="sync-status" id="gembaSyncStatus">Last synced: --:--:--</div>
                <div class="header-icon"><i class="fas fa-sync-alt"></i></div>
                <button class="pdf-export-btn" id="gembaPdfBtn" title="Export PDF" onclick="exportGembaPdf()">
                    <i class="fas fa-file-pdf"></i> Export PDF
                </button>
                <div class="header-icon"><i class="fas fa-bell"></i><span class="notification-badge"></span></div>
                <div class="user-avatar" th:attr="data-username=${session.username != null ? session.username : 'User'}"><i class="fas fa-user"></i></div>
            </div>
        </header>

        <div class="content-area">
            <section class="gemba-card">
                <div class="gemba-filter-row">
                    <div class="gemba-filter-item">
                        <label for="gembaMonthFilter">Scheduled Month</label>
                        <div class="gemba-month-picker">
                            <input type="month" id="gembaMonthFilter" class="pms-month-picker" aria-label="Scheduled Month">
                            <i class="fas fa-calendar-days" aria-hidden="true"></i>
                        </div>
                    </div>
                </div>
                <div class="gemba-table-wrap">
                    <table class="gemba-table" id="gembaScheduleTable">
                        <thead>
                        <tr>
                            <th class="sortable" data-sort-key="functionType">Functions</th>
                            <th>Week # 1</th>
                            <th>Week # 2</th>
                            <th>Week # 3</th>
                            <th>Week # 4</th>
                            <th th:if="${canEditCurrentPage}">Action</th>
                        </tr>
                        </thead>
                        <tbody id="gembaScheduleBody">
                        <tr>
                            <td th:attr="colspan=${canEditCurrentPage} ? 6 : 5" class="gemba-empty">No schedule configured. Open Gemba Walk Schedule.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </div>

        <footer class="footer">
            <div class="footer-brand">
                <img class="footer-brand-logo" src="/images/solvex-logo.png" onerror="this.onerror=null;this.src='/images/solvex-logo.svg';" alt="Solvex Engineering Solution Logo">
            </div>
            <p>&copy; 2026 SolveX Engineering Solutions | All rights reserved | www.solvexes.com</p>
        </footer>
    </main>
</div>

<script src="/js/pdf-report.js"></script>
<script src="/js/gemba-schedule.js?v=nav-global-20260814"></script>
<script src="/js/pms-attachment.js?v=20260830"></script>
    <img src="/images/solvex-logo.png" class="solvex-watermark" alt="SolveX Watermark">
<script src="/js/ui-shell.js?v=smtp-nav-20260901"></script>
</body>
</html>
