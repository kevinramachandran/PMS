<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Training Schedule - Carlsberg Brewery</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/dashboard.css?v=nav-size-20260814">
    <link rel="stylesheet" href="/css/training-schedule.css?v=sticky-header-fix-20260913">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    <link rel="stylesheet" href="/css/ui-shell.css?v=training-scroll-gap-20260914">
</head>
<body class="modern-shell dashboard-bg" th:attr="data-can-edit-current-page=${canEditCurrentPage}">
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="app-container">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">
                <img class="logo header-logo" src="/images/image.png" alt="Carlsberg Logo">
            </div>
        </div>
        <nav th:replace="~{fragments/local-navigation :: navigation}"></nav>
        <div class="sidebar-footer">
            <img src="/images/solvex-logo.png" alt="SolveX" class="sidebar-solvex-logo">
        </div>
    </aside>

    <main class="main-content">
        <header class="top-header">
            <div class="header-left">
                <div class="hamburger" id="hamburger"><span></span><span></span><span></span></div>
                <h1>Training Compliance</h1>
            </div>
            <div class="header-center">
                <label class="header-filter-label" for="trainingMonthFilter">Month</label>
                <div class="training-month-picker">
                    <input type="month" id="trainingMonthFilter" class="header-filter-select pms-month-picker" aria-label="Training month and year">
                    <i class="fas fa-calendar-days" aria-hidden="true"></i>
                </div>
            </div>
            <div class="header-right">
                <div class="sync-status" id="trainingSyncStatus">Last synced: --:--:--</div>
                <button class="pdf-export-btn" id="trainingPdfBtn" title="Export PDF" onclick="exportTrainingPdf()">
                    <i class="fas fa-file-pdf"></i> Export PDF
                </button>
                <div class="header-icon"><i class="fas fa-bell"></i><span class="notification-badge"></span></div>
                <div class="user-avatar" th:attr="data-username=${session.username != null ? session.username : 'User'}"><i class="fas fa-user"></i></div>
            </div>
        </header>

        <div class="content-area">
            <section class="ts-card">
                <div class="ts-table-wrap">
                    <table class="ts-table" id="trainingScheduleTable">
                        <thead>
                        <tr>
                            <th class="sortable" data-sort-key="index">S.No</th>
                            <th class="sortable" data-sort-key="trainingName">Name of the Training</th>
                            <th class="sortable" data-sort-key="targetAudience">Target Audience</th>
                            <th class="sortable" data-sort-key="trainer">Trainer</th>
                            <th class="sortable" data-sort-key="trainingDate">Date</th>
                            <th class="sortable" data-sort-key="timeSlot">Time</th>
                            <th class="sortable" data-sort-key="durationHours">Duration (Hours)</th>
                            <th class="sortable" data-sort-key="venue">Venue</th>
                            <th class="sortable" data-sort-key="fpr">FPR</th>
                            <th class="sortable" data-sort-key="status">Status</th>
                            <th th:if="${canEditCurrentPage}">Action</th>
                        </tr>
                        </thead>
                        <tbody id="trainingScheduleBody">
                        <tr>
                            <td th:attr="colspan=${canEditCurrentPage} ? 11 : 10" class="ts-empty">No training schedule configured. Open Training Schedule.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </div>

        <footer class="footer">
            <div class="footer-brand">
                <img class="footer-brand-logo" src="/images/solvex-logo.png" onerror="this.onerror=null;this.src='/images/solvex-logo.svg';" alt="Solvex Engineering Solution Logo">
            </div>
            <p>&copy; 2026 SolveX Engineering Solutions | All rights reserved | www.solvexes.com</p>
        </footer>
    </main>
</div>

<script src="/js/pdf-report.js"></script>
<script src="/js/training-schedule.js?v=nav-global-20260814"></script>
    <img src="/images/solvex-logo.png" class="solvex-watermark" alt="SolveX Watermark">
<script src="/js/ui-shell.js?v=smtp-nav-20260901"></script>
</body>
</html>
