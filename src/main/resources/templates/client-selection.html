<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Info Portal - Carlsberg Brewery</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/dashboard.css?v=nav-size-20260814">
    <link rel="stylesheet" href="/css/ui-shell.css?v=sticky-table-header-20260913">
</head>
<body class="modern-shell">
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="app-container">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">
                <img class="logo header-logo" src="/images/image.png" alt="Carlsberg Logo">
            </div>
        </div>
        <nav th:replace="~{fragments/local-navigation :: navigation}"></nav>
        <div class="sidebar-footer">
            <img src="/images/solvex-logo.png" alt="SolveX" class="sidebar-solvex-logo">
        </div>
    </aside>

    <main class="main-content">
        <header class="top-header">
            <div class="header-left">
                <div class="hamburger" id="hamburger"><span></span><span></span><span></span></div>
                <h1>Info Portal</h1>
            </div>
            <div class="header-right">
                <div class="user-info-header">
                    <i class="fa-solid profile-role-icon" th:classappend="${session.role == 'ADMIN'} ? ' fa-user-shield' : ' fa-user'"></i>
                    <div class="profile-meta">
                        <div class="profile-name" th:text="${session.username != null ? session.username : 'User'}">User</div>
                        <div class="profile-subline">
                            <span class="header-role-badge" th:text="${session.roleLabel != null ? session.roleLabel : session.role}">ROLE</span>
                            <span class="profile-email" th:text="${session.email != null ? session.email : 'no-email@local'}">mail@example.com</span>
                        </div>
                    </div>
                </div>
                <a href="/logout" class="logout-btn" title="Logout">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Logout</span>
                </a>
            </div>
        </header>

        <div class="content-area">
            <div style="display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;min-height:60vh;gap:32px;text-align:left;padding:24px 0 0 24px;">
                <div class="info-portal-buttons" id="clientButtonsContainer" style="gap:20px;"></div>
            </div>
        </div>

        <footer class="footer">
            <div class="footer-brand">
                <img class="footer-brand-logo" src="/images/solvex-logo.png" onerror="this.onerror=null;this.src='/images/solvex-logo.svg';" alt="Solvex Engineering Solution Logo">
            </div>
            <p>&copy; 2026 SolveX Engineering Solutions | All rights reserved | www.solvexes.com</p>
        </footer>
    </main>
</div>

<script>
    (function () {
        function applyInfoPortalButtons(config) {
            var container = document.getElementById('clientButtonsContainer');
            if (!container) return;

            function normalizeInfoPortalHref(url) {
                var trimmed = String(url || '').trim();
                if (!trimmed) return '';
                if (/^(https?:\/\/|mailto:|tel:|\/|#)/i.test(trimmed)) {
                    return trimmed;
                }
                return 'https://' + trimmed;
            }

            var buttons = Array.isArray(config && config.buttons) ? config.buttons : [
                { id: 1, label: config && (config.kpiButton1Label || config.button1Label), type: config && (config.kpiButton1Type || config.button1Type), url: config && (config.kpiButton1Url || config.button1Url) },
                { id: 2, label: config && (config.kpiButton2Label || config.button2Label), type: config && (config.kpiButton2Type || config.button2Type), url: config && (config.kpiButton2Url || config.button2Url) }
            ];

            container.innerHTML = '';
            buttons.forEach(function(button) {
                var label = ((button && button.label) || '').trim();
                var type = ((button && button.type) || 'link').trim();
                var href = type === 'file'
                    ? '/api/dashboard-config/info-portal/file/' + button.id
                    : normalizeInfoPortalHref(button && button.url);
                if (!label || !href) return;
                var anchor = document.createElement('a');
                anchor.className = 'info-portal-btn';
                anchor.href = href;
                anchor.target = '_blank';
                anchor.textContent = label;
                anchor.style.padding = '16px 40px';
                anchor.style.fontSize = '15px';
                container.appendChild(anchor);
            });
        }

        fetch('/api/dashboard-config/kpi')
            .then(function (r) { return r.ok ? r.json() : Promise.reject(); })
            .then(function (config) { applyInfoPortalButtons(config); })
            .catch(function () { applyInfoPortalButtons({}); });
    })();
</script>
<img src="/images/solvex-logo.png" class="solvex-watermark" alt="SolveX Watermark">
<script src="/js/ui-shell.js?v=smtp-nav-20260901"></script>
</body>
</html>
